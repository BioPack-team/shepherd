requirepass supersecretpassword
port 6379
# Keep this well under the container's memory limit (about 50%): snapshot and
# AOF-rewrite forks, allocator fragmentation and client buffers all add to the
# container's memory on top of the data.
maxmemory 6gb
# When the memory cap is hit, evict the blobs closest to expiry first. Every
# data payload is written with the same TTL (see ``redis_ttl``), so nearest-
# expiry == oldest-written: we shed the oldest finished-query debug blobs first
# and keep recent ones. Unlike ``allkeys-lru`` this only touches keys that have
# a TTL, so it can never evict live task streams (which carry no TTL) or,
# in practice, in-flight queries -- those were written most recently and thus
# have the most TTL remaining, making them the last candidates, not the first.
# Worker heartbeat keys are likewise written WITHOUT a TTL for this reason: a
# short-lived heartbeat would be the first thing evicted under pressure, which
# would make live workers look crashed. They stay persistent and the monitor
# reaps stale ones by last_seen age instead (see shepherd_utils/heartbeat.py).
maxmemory-policy volatile-ttl
loglevel notice
# If we want to log to a file
logfile /data/shepherd_broker.log
# Persistence. Snapshots alone lost every write since the last one on a
# crash -- in-flight query blobs, queued stream tasks, received callbacks --
# which the monitor then has to fail as errors (workers/monitor/recovery.py).
# The append-only file is fsynced once a second, so a crash now loses ~1s of
# writes. It is rewritten (with an RDB preamble, so it loads as fast as a
# snapshot) only once it has doubled and is past 1gb: our values are large
# blobs, and the 64mb default would rewrite -- fork -- almost continuously.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 1gb
# The snapshot is now only a backup. Every snapshot forks, and while the fork
# runs every page the parent writes is copied, so under write load the
# container's real memory approaches 2x the dataset -- invisible to
# ``used_memory`` and the likeliest way to get OOM-killed. Snapshot hourly
# instead of every minute.
save 3600 1
stop-writes-on-bgsave-error no
# Must be on the persistent volume: the AOF directory and the snapshot are
# both written under it. Left unset, Redis writes them to its working
# directory, which in Kubernetes is the container's small ephemeral storage --
# filling that gets the pod evicted and the data thrown away with it.
dir /data
dbfilename shepherd_broker.rdb

# enable larger entry writes
proto-max-bulk-len 1000mb

# clean up any memory leaks
# activedefrag yes

# Cap the memory all client buffers may use together. A worker sending or
# reading a large blob holds it in a query/output buffer that counts toward
# maxmemory; with several big transfers at once that pushed out stored data
# (or, past maxmemory, the whole container). Over this cap Redis disconnects
# the biggest client instead -- that one write fails and is retried, rather
# than everyone losing data. 20% leaves room for one transfer the size of
# proto-max-bulk-len below.
maxmemory-clients 20%
# close idle clients
timeout 120
