name: 'Pull Request Feedback'

on: 
  pull_request:

jobs:
  test:
    name: Run tox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      # Only the coverage env: it runs the whole suite, and its report is what
      # is uploaded below. Plain `tox` runs the suite a second time (py312).
      - name: Run tox
        run: tox -e coverage
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage*
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  rust-scorer:
    # The aragorn.score worker's Rust scorer: build the Python module and run
    # the scorer tests with it, so Python/Rust parity is checked on every PR
    # (in the tox job those tests skip: the module isn't built there).
    name: Rust scorer parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Shepherd and the test requirements
        run: |
          python -m pip install --upgrade pip maturin
          pip install -r test-requirements.txt
          pip install .

      - name: Build and install the Rust scorer
        run: |
          (cd workers/aragorn_score/rust && rustup toolchain install)  # rust-toolchain.toml's
          maturin build --release -m workers/aragorn_score/rust/Cargo.toml --out dist
          pip install dist/*.whl

      - name: Run the scorer tests
        run: python -m pytest -q tests/unit/aragorn tests/unit/test_ranker_omnicorp.py

  check-format:
    name: Check that code matches Black formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: psf/black@stable
