      - ./logs:/app/logs
      - ./.env:/app/.env
######### Translator ARS (hosted port of NCATSTranslator/Relay)
  # Opt-in: these services sit in the `ars` profile, so a plain
  # `docker compose up` skips them. Include them with
  # `docker compose --profile ars up --build` (or COMPOSE_PROFILES=ars).
  ars_fanout:
    container_name: ars_fanout
    init: true
    cpus: 1
    mem_limit: 2g
    profiles: [ars]
    build:
      context: .
      dockerfile: workers/ars_fanout/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    environment:
      <<: *postgres_budget
      ARS_PAYLOAD_DIR: /app/ars_payloads
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
