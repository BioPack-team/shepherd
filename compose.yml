# Local development stack.
#
#   docker compose up --build                 # core stack
#   docker compose --profile ars up --build   # + the opt-in Translator ARS
#
# Resource limits: every service carries `cpus` / `mem_limit` so local behavior
# matches prod. Docker writes a cgroup CPU quota (which resolve_pool_workers
# reads to size the pool) and a memory limit (so a child that balloons is
# actually OOM-killed). Without them a container sees the whole host, the pool
# sizes huge, and none of the sizing / OOM / recovery behavior reproduces.
# Docker refuses to start a container whose `cpus` exceeds the host's cores, so
# the stack needs a machine (or Docker Desktop VM) with at least 6 CPUs.
#
# Published ports: the datastores, RedisInsight, the monitor and Jaeger listen
# on 127.0.0.1 only -- they run with development credentials (or none), so they
# must not be reachable from other machines. Reach them from elsewhere with an
# SSH tunnel. The API server (5439) stays on every interface: subservices call
# back to it through host.docker.internal, which a loopback-only port refuses.
# The production values live in the Helm chart -- keep the two in step.
# To run without limits locally, override them in a gitignored
# compose.override.yml (`cpus: 0` / `mem_limit: 0` means unlimited).
#
# Init: every worker runs with `init: true`, so a small init (tini) is PID 1
# rather than `python worker.py`. Processes orphaned inside the container are
# re-parented to PID 1, and Python never reaps children it didn't start, so
# without an init they pile up as <defunct> entries.

# Postgres connection budget (#223 C11-3). Every process's pool max is its
# share of one fleet-wide budget -- budget x POSTGRES_POOL_SHARES /
# POSTGRES_FLEET_SHARES -- instead of a hand-set size per container, so the
# fleet stays inside max_connections (400, see shepherd_db) however it is
# scaled. 360 leaves 37 of the 397 usable connections (3 are
# superuser-reserved) for migrations, psql and slack.
#
# FLEET_SHARES is the sum of every DB-connecting process's shares with the
# `ars` profile on: 24 workers and the monitor at 1, the two lookup workers at
# 3, and the server's 4 uvicorn processes (WEB_CONCURRENCY) at 1 each -- 35,
# so 10 connections a share. Without the profile the fleet is 30 shares and
# the pools are simply sized conservatively. Adding a DB-connecting service or
# changing a share means changing this total;
# tests/unit/test_connection_budget.py checks it against this file. In a
# deployment, compute it from the replica counts, so scaling a deployment
# shrinks every pool instead of overrunning max_connections.
x-postgres-budget: &postgres_budget
  POSTGRES_CONNECTION_BUDGET: 360
  POSTGRES_FLEET_SHARES: 35

services:
  # The shared base image (shepherd_base/Dockerfile) every Shepherd image is
  # built on, through `additional_contexts` -- compose builds it first. It is
  # never run: `scale: 0` gives it no container. (It used to be kept out of
  # `up` with a profile instead, but some Compose versions drop a
  # profile-disabled service before resolving `additional_contexts`, and then
  # every image that builds on it fails with "declares unknown service
  # shepherd_base as additional contexts".)
  shepherd_base:
    image: shepherd_base
    build:
      context: .
      dockerfile: shepherd_base/Dockerfile
      args:
        PYTHON_IMAGE: ${SHEPHERD_PYTHON_IMAGE:-ghcr.io/translatorsri/renci-python-image:3.12.13}
    scale: 0

  shepherd_server:
    container_name: shepherd_server
    cpus: 3
    mem_limit: 5g
    platform: linux/amd64
    environment:
      <<: *postgres_budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassw0rd}
      # The server handles every client request (sync-query status polling,
      # /callback lookups). Pools are PER PROCESS and the server runs
      # WEB_CONCURRENCY=4 uvicorn workers (see its Dockerfile), so it holds 4
      # of the fleet's shares (x-postgres-budget above): 4 x 10 connections.
      POSTGRES_POOL_MIN_SIZE: 3
      # Durable ARS payloads live in files on a volume every ARS process
      # shares (the server reads them; ars_fanout/premerge/merge write them;
      # ars_watchdog evicts them), not in Postgres. See
      # shepherd_utils/ars/payload_store.py.
      ARS_PAYLOAD_DIR: /app/ars_payloads
      # /asyncquery refuses callbacks to private addresses (SSRF guard, see
      # shepherd_utils/callback_url.py). Locally the caller is on the host --
      # scripts/run_query.py --async calls back to host.docker.internal or the
      # docker bridge (172.17.0.1) -- so allow those here. finish_query
      # re-checks before delivering, so it needs the same list.
      CALLBACK_ALLOWED_HOSTS: &callback_allowed_hosts ${CALLBACK_ALLOWED_HOSTS:-host.docker.internal,172.16.0.0/12}
    build:
      context: .
      dockerfile: shepherd_server/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./shepherd_server/debug:/app/shepherd_server/debug
      - ./logs:/app/logs
      - ./.env:/app/.env
      # The ARAX API's autocomplete database (fetched on first start) and its
      # meta-KG backups
      - ./arax_dbs:/app/arax_dbs
      - ./ars_payloads:/app/ars_payloads
    ports:
      - '5439:5439'
  shepherd_db:
    container_name: shepherd_db
    cpus: 2
    mem_limit: 2g
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassw0rd}
    # Connection budget: every container holds its own psycopg pool, so the
    # fleet ceiling is (containers x pool max size). 22 workers/monitor at the
    # default max of 10, plus shepherd_server at 30, is 250 -- which overran
    # the old 200 and surfaced as "sorry, too many clients already" under load
    # even though the comments in this file and shepherd_utils/config.py both
    # say the sum must stay under it. 300 restores the headroom the docs claim.
    # Adding a worker service? Re-do this arithmetic.
    # The budget below assumes the opt-in `ars` profile is running too;
    # without it the worst case is 5 pools (~50) lower.
    # 2026-09: +5 ARS workers (ars_fanout/merge/postprocess/watchdog/notify)
    # at the default 10-max pool each pushed the worst case to ~290, so the
    # cap moves to 400 to restore headroom.
    # 2026-09 (later): shepherd_server now runs 4 uvicorn worker processes,
    # each with its own pool (4 x 10 = 40, was 1 x 30), aragorn_lookup and
    # bte_lookup moved to 30-max pools, and ars_premerge joined at the
    # default 10 -- worst case ~350, still under 400. ars_postprocess has
    # since been folded into ars_merge (one fewer pool).
    command: postgres -c max_connections=400
    build:
      context: .
      dockerfile: shepherd_db/Dockerfile
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 60s
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  shepherd_broker:
    container_name: shepherd_broker
    cpus: 2
    # About twice redis.conf's maxmemory (2gb): an AOF rewrite forks, and
    # fragmentation and client buffers sit on top of the data. Raise both
    # together (REDIS_MAXMEMORY in .env, and this in compose.override.yml).
    mem_limit: 4g
    build:
      context: .
      dockerfile: shepherd_broker/Dockerfile
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-supersecretpassword}
      # empty keeps redis.conf's maxmemory
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-}
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    # The default ``redis-cli ping`` healthcheck silently passed even before
    # Redis was ready, because (a) it didn't authenticate (NOAUTH error still
    # exits 0) and (b) during AOF/RDB load Redis answers ``LOADING`` instead
    # of ``PONG``, which redis-cli also exits 0 on. Grepping for an exact
    # ``PONG`` makes the check actually wait until Redis is fully online.
    # ``start_period`` gives a large RDB time to load before failures count.
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -qx PONG'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - ./data:/data
  shepherd_broker_insight:
    image: redislabs/redisinsight:latest
    container_name: shepherd_broker_insight
    restart: unless-stopped
    ports:
      - '127.0.0.1:5540:5540'
    volumes:
      - ./data/redisinsight:/db
  shepherd_monitor:
    container_name: shepherd_monitor
    init: true
    environment:
      <<: *postgres_budget
    cpus: 1
    mem_limit: 2g
    build:
      context: .
      dockerfile: workers/monitor/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    ports:
      - "127.0.0.1:5440:5440"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
      - ./workers/monitor/monitor_alerts.yaml:/app/monitor_alerts.yaml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:6381:6381/udp" # Agent UDP (Jaeger native)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=error
  

  ########## Shared Workers
  merge_message:
    container_name: merge_message
    init: true
    environment:
      <<: *postgres_budget
    cpus: 2
    mem_limit: 5g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/merge_message/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./workers/merge_message/debug:/app/debug
      - ./logs:/app/logs
      - ./.env:/app/.env
  sort_results_score:
    container_name: sort_results_score
    init: true
    environment:
      <<: *postgres_budget
    cpus: 1
    mem_limit: 5g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/sort_results_score/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
  filter_results_top_n:
    container_name: filter_results_top_n
    init: true
    environment:
      <<: *postgres_budget
    cpus: 1
    mem_limit: 5g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/filter_results_top_n/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
  filter_kgraph_orphans:
    container_name: filter_kgraph_orphans
    init: true
    environment:
      <<: *postgres_budget
    cpus: 1
    mem_limit: 5g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/filter_kgraph_orphans/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./workers/filter_kgraph_orphans/debug:/app/debug
      - ./logs:/app/logs
      - ./.env:/app/.env
  finish_query:
    container_name: finish_query
    init: true
    cpus: 1
    mem_limit: 5g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/finish_query/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    environment:
      <<: *postgres_budget
      CALLBACK_ALLOWED_HOSTS: *callback_allowed_hosts
      # finish_query archives every finished ARA response to the cold store
      ARS_PAYLOAD_DIR: /app/ars_payloads
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
      - ./ars_payloads:/app/ars_payloads
  filter_analyses_top_n:
    container_name: filter_analyses_top_n
    init: true
    environment:
      <<: *postgres_budget
    cpus: 1
    mem_limit: 5g
    build:
      context: .
      dockerfile: workers/filter_analyses_top_n/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
  score_paths:
    container_name: score_paths
    init: true
    environment:
      <<: *postgres_budget
    cpus: 6
    mem_limit: 22g
    build:
      context: .
      dockerfile: workers/score_paths/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
      # First run? Set PATHFINDER_EMBEDDINGS_URL in your .env to a .tar.gz and
      # the worker downloads + extracts the embeddings LMDB into this mount on
      # startup (see README "Worker data (LMDB / sqlite) downloads").
      - ./pathfinder_embeddings:/app/pathfinder_embeddings
      - ./workers/score_paths/debug:/app/debug

  ######### Example ARA
  example_ara:
    container_name: example_ara
    init: true
    environment:
      <<: *postgres_budget
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/example_ara/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
  example_lookup:
    container_name: example_lookup
    init: true
    environment:
      <<: *postgres_budget
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/example_lookup/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
  example_score:
    container_name: example_score
    init: true
    environment:
      <<: *postgres_budget
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/example_score/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env


  ######### ARAGORN
  aragorn:
    container_name: aragorn
    init: true
    environment:
      <<: *postgres_budget
    cpus: 1
    mem_limit: 1g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/aragorn/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
  aragorn_lookup:
    container_name: aragorn_lookup
    init: true
    cpus: 1
    mem_limit: 1g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/aragorn_lookup/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    environment:
      <<: *postgres_budget
      # Lookup fan-out issues far more concurrent DB ops than the default
      # 10-connection pool: at 40 concurrent queries the pool queued ~4k
      # requests (2,620s cumulative wait vs 739s of actual DB work) and
      # acquisitions timed out, so the hot lookup workers take a larger
      # share of the fleet's connection budget.
      POSTGRES_POOL_MIN_SIZE: 10
      # three shares of the fleet budget (x-postgres-budget): 30 connections
      POSTGRES_POOL_SHARES: 3
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./workers/aragorn_lookup/debug:/app/debug
      - ./logs:/app/logs
      - ./.env:/app/.env
  aragorn_pathfinder:
    container_name: aragorn_pathfinder
    init: true
    environment:
      <<: *postgres_budget
    cpus: 1
    mem_limit: 5g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/aragorn_pathfinder/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./workers/aragorn_pathfinder/debug:/app/debug
      - ./logs:/app/logs
      - ./.env:/app/.env
      # First run? Set PATHFINDER_SEARCH_GRAPH_URL in your .env to a .tar.gz and
      # the worker downloads + extracts the search graph into this mount on
      # startup (see README "Worker data (LMDB / sqlite) downloads").
      - ./pathfinder_search_graph:/app/pathfinder_search_graph
      - ./pathfinder_embeddings:/app/pathfinder_embeddings
  aragorn_omnicorp:
    container_name: aragorn_omnicorp
    init: true
    environment:
      <<: *postgres_budget
    cpus: 2 # -> pool sizes to 2; confirm via the "process pool sized to 2 worker(s)" startup log
    mem_limit: 6g # -> a child exceeding this is cgroup-OOM-killed (kernel), parent survives
    # Robustness-test knobs: uncomment per test (see scripts/seed_omnicorp.py).
    # Env set here is scoped to this service and overrides the shared .env.
    # environment:
      # P0 timeout: set a short limit, then replay a big/slow query. Expect
      # "task exceeded 10s; killing the stuck child", that query -> finish_query
      # ERROR, and the NEXT task succeeding.
      # POOL_TASK_TIMEOUT_SEC: "10"
      # Pin pool concurrency (e.g. to 1) instead of trusting cgroup detection.
      # Also the reliable way to serialize tasks for the idempotency demo.
      # POOL_MAX_WORKERS: "1"
      # Child recycling cadence (default 100). Lower it to watch RSS sawtooth
      # sooner under a --repeat run in `docker stats` / the monitor.
      # POOL_MAX_TASKS_PER_CHILD: "20"
      # Loop watchdog threshold (default 60s). Only fires on a genuinely wedged
      # loop -- to see it, temporarily inject a blocking sleep in poll_for_tasks.
      # WORKER_LOOP_STALL_EXIT_SEC: "60"
      # Broker-wedge self-heal window (default 300s). Lower it, then
      # `docker compose stop shepherd_broker`, to see the worker exit + restart.
      # BROKER_UNHEALTHY_EXIT_SEC: "30"
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/aragorn_omnicorp/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./workers/aragorn_omnicorp/debug:/app/debug
      - ./logs:/app/logs
      - ./.env:/app/.env
      # First run? Set OMNICORP_LMDB_URL in your .env to a .tar.gz and the worker
      # downloads + extracts curies.lmdb / shared_counts.lmdb into this mount on
      # startup (see README "Worker data (LMDB / sqlite) downloads").
      - ./omnicorp_lmdb:/app/omnicorp_lmdb
  aragorn_score:
    container_name: aragorn_score
    init: true
    environment:
      <<: *postgres_budget
    cpus: 4
    mem_limit: 10g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/aragorn_score/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env


  ######### ARAX
  arax:
    container_name: arax
    init: true
    # Runs ARAX's whole plan in-process (DEC-14): one pool child per query, so
    # cpus is how many queries run at once. A large multi-hop answer's KG and
    # results live in one child, hence about 3 GB per child.
    cpus: 4
    mem_limit: 12g
    environment:
      <<: *postgres_budget
      # ARAX puts no ceiling on a query, and Expand waits up to 120 s per hop,
      # so the shared 300 s default would kill slow multi-hop queries.
      POOL_TASK_TIMEOUT_SEC: "900"
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/arax/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
      # First run? The worker downloads the data files ARAX's actions read on
      # startup (see README "Worker data (LMDB / sqlite) downloads"): the
      # pathfinder's two sqlite dbs (NGD, the tier0 overlay used by FET) into
      # the shared arax_pathfinder_dbs, and curie_to_pmids, ExplainableDTD, FDA
      # drugs and COHD into arax_dbs.
      - ./arax_pathfinder_dbs:/app/arax_pathfinder_dbs
      - ./arax_dbs:/app/arax_dbs
  arax_pathfinder:
    container_name: arax_pathfinder
    init: true
    environment:
      <<: *postgres_budget
    cpus: 6
    mem_limit: 22g
    build:
      context: .
      dockerfile: workers/arax_pathfinder/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
      # First run? The worker downloads its two sqlite dbs from
      # kg2webhost.rtx.ai, plus the ARAX blocked-concept list from GitHub, on
      # startup -- no credentials needed. All three live here, so they persist
      # across restarts instead of being re-fetched by each new container. Set
      # ARAX_PATHFINDER_TIER_VERSION in your .env if you need a tier other than
      # the default (see README "Worker data (LMDB / sqlite) downloads").
      # Deploying elsewhere? ARAX_PATHFINDER_DBS_DIR must point at the mount --
      # it defaults to a path relative to /app, and a mismatch silently
      # re-downloads everything instead of using the mounted copies.
      - ./arax_pathfinder_dbs:/app/arax_pathfinder_dbs

  arax_rank:
    container_name: arax_rank
    init: true
    environment:
      <<: *postgres_budget
    cpus: 4
    mem_limit: 10g
    build:
      context: .
      dockerfile: workers/arax_rank/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env

######### BTE
  bte:
    container_name: bte
    init: true
    environment:
      <<: *postgres_budget
    cpus: 1
    mem_limit: 1g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/bte/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
  
  bte_lookup:
    container_name: bte_lookup
    init: true
    cpus: 1
    mem_limit: 1g
    platform: linux/amd64
    build:
      context: .
      dockerfile: workers/bte_lookup/Dockerfile
      additional_contexts:
        shepherd_base: service:shepherd_base
    restart: unless-stopped
    environment:
      <<: *postgres_budget
      # same lookup fan-out profile as aragorn_lookup (see its note)
      POSTGRES_POOL_MIN_SIZE: 10
      # three shares of the fleet budget (x-postgres-budget): 30 connections
      POSTGRES_POOL_SHARES: 3
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
    volumes:
      - ./workers/bte_lookup/debug:/app/debug
      - ./logs:/app/logs
      - ./.env:/app/.env
  
######### SIPR
  sipr:
    container_name: sipr
