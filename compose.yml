  score_paths:
    container_name: score_paths
    cpus: 6
    mem_limit: 22g
    build:
      context: .
      dockerfile: workers/score_paths/Dockerfile
    restart: unless-stopped
    depends_on:
      shepherd_db:
        condition: service_healthy
      shepherd_broker:
        condition: service_healthy
