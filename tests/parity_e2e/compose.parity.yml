# Differential parity topology: the original Relay ARS and Shepherd's port,
# side by side, both pointed at the same mockworld.
#
#   docker compose -f compose.yml -f tests/parity_e2e/compose.parity.yml up
#   (plus the Relay stack from its own checkout -- see README.md)
#
# This overlay only adds the mockworld and repoints Shepherd's external
# service URLs at it; the Relay stack runs from the pinned checkout with the
# matching env (TR_NORMALIZER pointing at the same mockworld, and its
# smart-api URL patched to the stub registry). The mockworld still serves
# /get_appraisal and /curie so a stray appraiser or annotator-API call from
# either stack shows up in the journals, but neither stack makes one: the
# appraiser call was removed upstream (Relay PR #884) and BOTH stacks now
# annotate in-process via the biothings_annotator package, which talks to
# the live BioThings APIs (identically on both sides, but not hermetic --
# pin the backend with the package's SERVICE_PROVIDER_API_HOST env on both
# stacks if that ever matters for a scenario).

services:
  mockworld:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install fastapi uvicorn httpx zstandard
        COPY tests/parity_e2e/mockworld /mockworld
        WORKDIR /mockworld
        CMD ["python", "app.py"]
    ports:
      - "8099:8099"

  shepherd_server:
    environment:
      ARS_PUBLIC_HOST: http://shepherd_server:5439
      SMARTAPI_URL: http://mockworld:8099/api/query
      TR_NORMALIZER: http://mockworld:8099/get_normalized_nodes

  ars_fanout:
    environment:
      ARS_PUBLIC_HOST: http://shepherd_server:5439
      SMARTAPI_URL: http://mockworld:8099/api/query
