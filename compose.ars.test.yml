# Local test overlay for the opt-in ARS services (compose.ars.yml): the same
# prod-matching cpu / memory limits compose.test.yml gives the base workers
# (see its header for why they matter). Only valid alongside compose.ars.yml:
#
#   docker compose -f compose.yml -f compose.ars.yml \
#     -f compose.test.yml -f compose.ars.test.yml up --build

services:
  ars_fanout:
    cpus: 1
    mem_limit: 2g
  ars_merge:
    cpus: 2
    mem_limit: 5g
  ars_notify:
    cpus: 0.5
    mem_limit: 1g
  ars_premerge:
    cpus: 2
    mem_limit: 5g
  ars_watchdog:
    cpus: 0.5
    mem_limit: 1g
