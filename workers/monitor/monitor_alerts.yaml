# Default alert rules for the Shepherd monitoring dashboard.
#
# Mount this file at /app/monitor_alerts.yaml (the path is overridable via the
# MONITOR_ALERTS_CONFIG env var).
#
# Rule schema:
#   name:       unique identifier (used as cooldown key)
#   type:       threshold | heartbeat_lost | queue_pending | oldest_callback_age
#               | db_capacity | redis_eviction | stuck_pending
#               | payload_store_capacity
#   metric:     for type=threshold: xlen | callbacks_pending | pg_connection_count
#               | pg_connection_pct (client backends, % of max_connections
#               less the superuser-reserved slots)
#   stream:     redis stream name (for xlen / queue_pending / stuck_pending;
#               stuck_pending scans all streams when omitted)
#   worker:     worker type name (for heartbeat_lost)
#   threshold:  number to compare against (redis_eviction: keys-per-interval
#               floor; stuck_pending: min pending tasks per consumer)
#   idle_ms:    for stuck_pending: how long a consumer's held tasks must sit
#               idle before it counts as wedged
#   duration:   how long the condition must hold before firing (e.g. 60s, 5m)
#   cooldown:   how long to suppress repeat fires (default 10m)
#   severity:   info | warning | critical
#
# Redis instances. Shepherd's four Redis roles (broker, data, lock, logs) are
# one server by default and can each be given a Redis of their own
# (REDIS_<ROLE>_HOST / REDIS_<ROLE>_SENTINEL_MASTER). Everything the monitor
# checks about Redis -- the redis_eviction rule below and the automatic alerts
# described in the comments -- is checked per instance, with separate state
# (grace periods, cooldowns) for each. The instance serving the broker role
# keeps the alert names used here (`redis_evicting`, `redis_memory_high`, ...);
# any other instance's alerts have its name appended, e.g.
# `redis_evicting@shepherd_data:6379` or `redis_memory_high@sentinel:payloads`,
# and their text says which instance and which roles. With a single Redis
# nothing is renamed or reworded.

rules:
  # Queue backlog: any ARA entry stream that piles up for a minute.
  - name: aragorn_backlog
    type: threshold
    metric: xlen
    stream: aragorn.lookup
    threshold: 500
    duration: 60s
    severity: warning

  - name: arax_backlog
    type: threshold
    metric: xlen
    stream: arax
    threshold: 500
    duration: 60s
    severity: warning

  - name: bte_backlog
    type: threshold
    metric: xlen
    stream: bte.lookup
    threshold: 500
    duration: 60s
    severity: warning

  - name: sipr_backlog
    type: threshold
    metric: xlen
    stream: sipr
    threshold: 500
    duration: 60s
    severity: warning

  - name: finish_query_backlog
    type: threshold
    metric: xlen
    stream: finish_query
    threshold: 200
    duration: 60s
    severity: warning

  # Worker presence: alert if any required worker type has zero alive heartbeats.
  - name: aragorn_lookup_down
    type: heartbeat_lost
    worker: aragorn.lookup
    duration: 30s
    severity: critical

  - name: arax_down
    type: heartbeat_lost
    worker: arax
    duration: 30s
    severity: critical

  - name: bte_lookup_down
    type: heartbeat_lost
    worker: bte.lookup
    duration: 30s
    severity: critical

  - name: finish_query_down
    type: heartbeat_lost
    worker: finish_query
    duration: 30s
    severity: critical

  # Callback backlog: stuck callbacks indicate an ARA never responded.
  - name: oldest_callback_too_old
    type: oldest_callback_age
    threshold: 600
    duration: 30s
    severity: warning

  - name: callbacks_pending_high
    type: threshold
    metric: callbacks_pending
    threshold: 100
    duration: 2m
    severity: warning

  # Redis broker memory pressure is monitored automatically by the alert engine
  # (like broker/postgres availability) -- there is no rule to configure here.
  # It tiers usage into warning (>= 85%) and critical (>= 95%) so only one alert
  # fires at a time, re-notifies at most once a day while elevated, and emits a
  # redis_memory_recovered alert when usage falls back below the warning line.
  # Tune via the monitor_redis_memory_* settings (thresholds, grace, cooldown).
  # Evaluated for every Redis instance. The footprint side of the check needs
  # the container's memory limit: REDIS_MEMORY_LIMIT for the instance serving
  # the broker role, REDIS_DATA_MEMORY_LIMIT / REDIS_LOCK_MEMORY_LIMIT /
  # REDIS_LOGS_MEMORY_LIMIT for a role with a Redis of its own (unset skips
  # the footprint check for that instance; data-vs-maxmemory still runs).
  #
  # Also automatic, per instance, when it is at or above
  # MONITOR_REDIS_EVICTION_WINDOW_NEAR_CAP_PCT (90%) of maxmemory:
  # `redis_eviction_window_short` (critical) when maxmemory / write rate --
  # how long a newly written key survives once the instance is full and
  # evicting -- is shorter than the longest query budget times a safety factor
  # (ARS_TIMEOUT_MERGE_SEC x MONITOR_REDIS_EVICTION_WINDOW_SAFETY_FACTOR = 16
  # minutes by default; or set MONITOR_REDIS_EVICTION_WINDOW_MIN_SEC). Below
  # that, eviction takes the payloads of queries still running. The write
  # rate is smoothed over MONITOR_REDIS_WRITE_RATE_WINDOW_SEC and the condition
  # must hold for MONITOR_REDIS_MEMORY_GRACE_SEC, so a burst doesn't trip it.
  # `redis_eviction_window_recovered` (info) when it clears.

  # Redis eviction: with volatile-ttl, any eviction means the cap was reached
  # and blobs are being shed. threshold 0 => alert on the first eviction.
  # One rule covers every Redis instance: each has its own `duration` streak
  # and cooldown, and an instance other than the broker role's alerts as
  # `redis_evicting@<instance>`.
  - name: redis_evicting
    type: redis_eviction
    threshold: 0
    duration: 30s
    severity: warning

  # Wedged workers: tasks delivered to a consumer that then stopped acking. The
  # consumer may still heartbeat, so heartbeat_lost won't catch it. Fleet-wide
  # (no stream named). idle_ms comfortably exceeds normal task durations.
  - name: stuck_pending_tasks
    type: stuck_pending
    threshold: 1
    idle_ms: 120000
    duration: 60s
    severity: warning

  # Postgres availability is monitored automatically by the alert engine (like
  # the broker) -- no rule to configure. A sustained outage fires postgres_down
  # (critical) and recovery fires postgres_recovered (info). Tune the debounce
  # via MONITOR_POSTGRES_DOWN_GRACE_SEC.

  # Postgres health: connection saturation.
  #
  # Client backends as a share of what Postgres accepts (max_connections less
  # superuser_reserved_connections), read live from the server (#223 C11-3).
  # It used to be a raw count (250) that had to be recomputed by hand against
  # the fleet's idle floor and max_connections whenever workers, pool sizes or
  # replicas changed. The idle floor (every process holds its pool's min size
  # open) is ~20% of max_connections on the compose topology, so 80% fires on
  # load, not at rest, and still ahead of the point where new connections
  # start being refused.
  - name: pg_connection_saturation
    type: threshold
    metric: pg_connection_pct
    threshold: 80
    duration: 1m
    severity: warning

  # Postgres disk capacity: warn before the data volume fills and crashes PG.
  # Driven by PG_VOLUME_CAPACITY (set from the same Helm value as the PVC size);
  # these rules are a no-op until that env var is configured. The percentage is
  # based on pg_database_size + WAL, which under-counts true filesystem usage --
  # treat as early warning, not a replacement for an infra-level volume alert.
  #
  # Disk usage moves slowly and isn't fixed in minutes, so these re-notify far
  # less often than the 10m default: the warning once a day, the critical tier
  # every 2h while it holds.
  - name: pg_disk_almost_full
    type: db_capacity
    threshold: 80
    duration: 2m
    cooldown: 24h
    severity: warning
    message: "Postgres data volume is over 80% full. Plan to grow the PVC soon."

  - name: pg_disk_critically_full
    type: db_capacity
    threshold: 90
    duration: 1m
    cooldown: 2h
    severity: critical
    message: "Postgres data volume is over 90% full. Grow the PVC now to avoid a crash."

  # ARS payload volume (ARS_PAYLOAD_DIR). The ARS watchdog evicts finished
  # trees once it passes ARS_PAYLOAD_EVICT_HIGH_PCT (80% by default), so being
  # above that means eviction can't keep up -- a burst, or the volume filling
  # with retained / still-running trees, which are never evicted. The alert
  # says how much is retained. A no-op unless the watchdog is publishing.
  - name: ars_payload_volume_almost_full
    type: payload_store_capacity
    threshold: 85
    duration: 2m
    severity: warning
    message: "ARS payload volume is over 85% and eviction isn't bringing it down. Grow the volume, or release retained trees."

  - name: ars_payload_volume_critically_full
    type: payload_store_capacity
    threshold: 95
    duration: 1m
    severity: critical
    message: "ARS payload volume is over 95% full. Durable copies will start failing; grow the volume now."

# Broker (Redis) availability is monitored automatically by the alert engine --
# there is no rule to configure here. The poller PINGs the broker each tick; a
# sustained failure fires a single `broker_down` (critical) alert and, on
# return, a `broker_recovered` (info) alert. Across the outage and a short
# post-recovery window, worker-down alerts are suppressed, because a broker
# restart transiently zeroes every worker's heartbeats and would otherwise
# surface as one spurious worker-crash alert per worker type. Tune via the
# MONITOR_BROKER_DOWN_GRACE_SEC and MONITOR_BROKER_RECOVERY_GRACE_SEC settings.
#
# A broker *restart* is spotted the same way, from Redis' run_id changing
# (workers/monitor/recovery.py), and fires a `redis_restarted` (warning) alert:
# Redis comes back from its last snapshot, so everything written after it is
# gone. Once it has loaded, and MONITOR_REDIS_RESTART_GRACE_SEC later, queries
# that lost their data in it -- or the task that would have moved them on --
# are finished as errors, with one `query_data_lost` (warning) alert per
# query, batched.
#
# Every Redis instance's run_id is watched, and what a restart sets off
# depends on the roles the instance serves: the data role's instance holds the
# payloads, so its restart runs the lost-data sweep; the broker role's holds
# the task streams, so its restart runs the lost-task sweep; one serving only
# locks and/or logs alerts and sweeps nothing. One shared Redis runs both, as
# before. An instance other than the broker role's alerts as
# `redis_restarted@<instance>`.
#
# Behind Sentinel a failover changes the run_id as well (another server is the
# primary), and loses whatever the old primary had not replicated, so it
# triggers the same sweeps. When the new primary is recognisably the old one's
# promoted replica (its secondary replication id is the old primary's id) the
# alert is `redis_failover` (warning) instead; when that can't be told, the
# `redis_restarted` text says "restarted or failed over".
#
# Redis persistence is monitored automatically too, per instance:
# `redis_persistence_failing` says which save failed and what it costs --
#   * "AOF write failing: writes are not being persisted" (critical);
#   * "AOF rewrite failed: no data lost yet, but the AOF will keep growing"
#     (warning when it is the only failure);
#   * "RDB snapshot failed" (critical), with whether an AOF still covers it.
# It fires once, again if a warning becomes critical, and
# `redis_persistence_recovered` (info) fires when every save succeeds again.
#
# Redis replication is monitored automatically, per instance, and is a no-op
# for an instance that has never had a connected replica (the single-server
# default). All of it is debounced by MONITOR_REDIS_REPLICA_GRACE_SEC (60s)
# in both directions:
#   * `redis_replicas_lost` when an instance has fewer connected replicas
#     than it has had since the monitor started (warning; critical at zero),
#     and `redis_replicas_recovered` (info) when they are all back;
#   * `redis_replica_lagging` (warning) when a replica is still syncing, has
#     not been heard from for MONITOR_REDIS_REPLICA_LAG_SEC (30s), or is more
#     than MONITOR_REDIS_REPLICA_LAG_BYTES (256 MiB; 0 disables) behind, and
#     `redis_replica_caught_up` (info) when none is.
