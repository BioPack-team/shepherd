[project]
name = "shepherd"
version = "2.0.1"
description = "A shared platform for Translator ARAs"
authors = [{ name = "Max Wang", email = "max@covar.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi~=0.110",
  "httpx~=0.28",
  "opentelemetry-api==1.42.1",
  "opentelemetry-sdk==1.42.1",
  "opentelemetry-exporter-otlp==1.42.1",
  "opentelemetry-instrumentation-fastapi==0.63b1",
  "opentelemetry-instrumentation-httpx==0.63b1",
  "opentelemetry-instrumentation-redis==0.63b1",
  "orjson~=3.10",
  "psycopg[binary]~=3.1",
  "psycopg_pool~=3.2",
  "pycryptodome~=3.20",
  "pydantic~=2.12",
  "pydantic-settings~=2.9",
  "python-dotenv~=1.0",
  "pyyaml~=6.0",
  "redis~=5.2",
  "scipy",
  "six~=1.16",
  # The Translator-wide TRAPI object model: TRAPI 2.0 request validation,
  # the OpenAPI schemas, and TypedDicts for the internal (dict) messages.
  "translator_tom~=2.2",
  "uvicorn[standard]~=0.29",
  "zstandard~=0.23"
]

[project.optional-dependencies]
# What the server's ARAX API (shepherd_server/aras/arax.py) needs on top of the
# base install: /status, /entity and the recent-PK view use ARAX's SmartAPI
# client and NodeSynonymizer (ARAX's pins where it has them). /arax/response/{id}
# validates TRAPI 2.0 with translator_tom (a base dependency), not ARAX's
# reasoner-validator, which only knows TRAPI <= 1.6.
arax-api = [
  "aiohttp",
  "bmt==1.4.8",
  "pandas",
  "requests",
  "requests-cache==1.2.1",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Scan from the repo root so the first-party packages are installed under their
# real dotted names (``shepherd_utils``, ``workers.monitor``, ...). The previous
# config pointed ``where`` *inside* each directory, so discovered names never
# matched the ``include`` filter and nothing first-party was actually installed
# -- importability silently depended on the working directory being /app.
# The trailing ``*`` (not ``.*``) keeps the top-level packages themselves.
where = ["."]
include = ["shepherd_utils*", "workers*", "shepherd_server*"]

[tool.setuptools.package-data]
shepherd_utils = ["*.yml"]
# The ARS port bundles its upstream blocklist and the schema DDL applied by
# startup upgrades on pre-existing volumes.
"shepherd_utils.ars" = ["blocklist.json", "*.sql"]

# The ARAX port bundles data files vendored from RTX at its pinned commit
# (general_concepts.json, the QG interpreter templates, ...).
"shepherd_utils.arax" = ["KnowledgeSources/*.json", "*.yaml"]
# The vendored xCRG package bundles its transcription-factor list.
"shepherd_utils.arax.xcrg.resources" = ["*.json"]

[tool.black]
# Match requires-python, so black parses and checks with the running 3.12.
target-version = ["py312"]
# The ARAX port mirrors upstream RTX module-for-module (and vendors ARAX's
# generated TRAPI models); it is kept unformatted so it stays diffable against
# upstream. Shepherd-specific glue lives outside it. See shepherd_utils/arax/README.md.
# Upstream ARAX's own test files (tests/unit/arax/upstream_suite/test_*.py) and
# upstream xCRG's (tests/unit/arax/xcrg_suite/test_*.py) are vendored verbatim
# for the same reason.
extend-exclude = "(shepherd_utils/arax/|tests/unit/arax/upstream_suite/test_|tests/unit/arax/xcrg_suite/test_)"
